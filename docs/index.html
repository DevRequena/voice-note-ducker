<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Note Ducker</title>
    <meta name="description" content="Browser extension that lowers the music in your other tabs while a voice note plays, then brings it back. 100% local." />
    <link rel="icon" href="images/logo.png" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="./"><img src="images/logo.png" alt="" />Voice Note Ducker</a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-set-lang="en">EN</button>
        <button type="button" data-set-lang="es">ES</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="eyebrow"></p>
          <h1 data-i18n="title"></h1>
          <p class="lead" data-i18n="lead"></p>
          <div class="actions">
            <span class="btn btn-primary is-soon" data-i18n="soon"></span>
            <a class="btn btn-ghost" href="https://github.com/DevRequena/voice-note-ducker" data-i18n="github"></a>
          </div>
          <p class="browsers" data-i18n="browsers"></p>
        </div>
        <div class="hero-shot">
          <img id="shot-how" alt="" width="680" height="560" />
        </div>
      </section>

      <section class="features">
        <h2 data-i18n="featuresTitle"></h2>
        <div class="grid">
          <article class="card"><span class="icon">🎙️</span><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></article>
          <article class="card"><span class="icon">🔔</span><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></article>
          <article class="card"><span class="icon">🎚️</span><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></article>
          <article class="card"><span class="icon">⏭️</span><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></article>
          <article class="card"><span class="icon">✋</span><h3 data-i18n="f5t"></h3><p data-i18n="f5d"></p></article>
          <article class="card"><span class="icon">🔒</span><h3 data-i18n="f6t"></h3><p data-i18n="f6d"></p></article>
        </div>
      </section>

      <section class="steps">
        <h2 data-i18n="stepsTitle"></h2>
        <div class="steps-body">
          <ol>
            <li><span class="num">1</span><div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div></li>
            <li><span class="num">2</span><div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></div></li>
            <li><span class="num">3</span><div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></div></li>
          </ol>
          <img id="shot-settings" class="popup-shot" alt="" width="500" height="680" loading="lazy" />
        </div>
      </section>

      <section class="privacy">
        <div>
          <h2 data-i18n="privacyTitle"></h2>
          <p data-i18n="privacyText"></p>
        </div>
        <a class="btn btn-light" href="privacy-policy" data-i18n="privacyLink"></a>
      </section>
    </main>

    <footer class="footer">
      <span><span data-i18n="madeBy"></span> <a href="https://www.linkedin.com/in/devrequena-developer/">DevCesar</a></span>
      <nav>
        <a href="https://github.com/DevRequena/voice-note-ducker">GitHub</a>
        <a href="privacy-policy" data-i18n="privacyShort"></a>
        <a href="https://github.com/DevRequena/voice-note-ducker/issues" data-i18n="support"></a>
      </nav>
    </footer>

    <script>
      const TEXT = {
        en: {
          eyebrow: 'Browser extension · Free',
          title: 'Hear every voice note over your music',
          lead: 'When a voice note plays, the music in your other tabs fades down on its own. When it ends, everything goes back to its exact volume.',
          soon: 'Coming soon to the stores',
          github: 'View on GitHub',
          browsers: 'Chrome · Edge · Brave — works with WhatsApp Web, Telegram, Slack and Discord',
          featuresTitle: 'Small details that make it feel right',
          f1t: 'Automatic', f1d: 'Play a voice note and the music in YouTube, Spotify Web or any other tab goes down by itself.',
          f2t: 'Ignores notifications', f2d: 'Message sounds don’t touch your music. Only real voice notes do.',
          f3t: 'Your level', f3d: 'Choose how low the music goes, from 0 to 50%, and which sites count as voice note sites.',
          f4t: 'Notes in a row', f4d: 'Several voice notes back to back keep the music low, with no jumps in between.',
          f5t: 'Respects you', f5d: 'Change a player’s volume by hand while it’s lowered and your choice is kept.',
          f6t: '100% local', f6d: 'No account, no analytics, no network requests. Nothing leaves your browser.',
          stepsTitle: 'How it works',
          s1t: 'Play your music', s1d: 'YouTube, Spotify Web, a podcast — anything in a browser tab.',
          s2t: 'Play a voice note', s2d: 'In WhatsApp Web, Telegram, Slack or Discord. The music fades down in 0.2 s.',
          s3t: 'Done listening', s3d: 'Pause it or let it end. The music fades back to its exact volume.',
          privacyTitle: 'Private by design',
          privacyText: 'The extension only checks whether audio or video is playing and how loud it is. It never reads your messages and never connects to the internet.',
          privacyLink: 'Read the privacy policy',
          madeBy: 'Made by',
          privacyShort: 'Privacy',
          support: 'Support',
          altHow: 'Music lowered to 10% while a voice note plays',
          altSettings: 'Settings: music level and voice note sites',
        },
        es: {
          eyebrow: 'Extensión para el navegador · Gratis',
          title: 'Escucha cada nota de voz sin quitar la música',
          lead: 'Cuando suena una nota de voz, la música de tus otras pestañas baja sola. Al terminar, todo vuelve a su volumen exacto.',
          soon: 'Muy pronto en las tiendas',
          github: 'Ver en GitHub',
          browsers: 'Chrome · Edge · Brave — funciona con WhatsApp Web, Telegram, Slack y Discord',
          featuresTitle: 'Pequeños detalles que marcan la diferencia',
          f1t: 'Automática', f1d: 'Reproduce una nota de voz y la música de YouTube, Spotify Web o cualquier pestaña baja sola.',
          f2t: 'Ignora los avisos', f2d: 'Los sonidos de mensajes nuevos no tocan tu música. Solo las notas de voz de verdad.',
          f3t: 'Tu nivel', f3d: 'Elige cuánto baja la música, de 0 a 50 %, y qué webs cuentan como webs de notas de voz.',
          f4t: 'Notas seguidas', f4d: 'Varias notas de voz una tras otra mantienen la música baja, sin subidas entre medias.',
          f5t: 'Te respeta', f5d: 'Si cambias a mano el volumen de un reproductor mientras está bajado, se queda tu cambio.',
          f6t: '100 % local', f6d: 'Sin cuentas, sin estadísticas y sin conexiones a internet. Nada sale de tu navegador.',
          stepsTitle: 'Cómo funciona',
          s1t: 'Pon tu música', s1d: 'YouTube, Spotify Web, un pódcast… lo que sea en una pestaña.',
          s2t: 'Reproduce una nota de voz', s2d: 'En WhatsApp Web, Telegram, Slack o Discord. La música baja en 0,2 s.',
          s3t: 'Termina de escuchar', s3d: 'Páusala o deja que acabe. La música vuelve poco a poco a su volumen exacto.',
          privacyTitle: 'Privada de verdad',
          privacyText: 'La extensión solo mira si hay audio o vídeo sonando y a qué volumen. Nunca lee tus mensajes y nunca se conecta a internet.',
          privacyLink: 'Leer la política de privacidad',
          madeBy: 'Hecho por',
          privacyShort: 'Privacidad',
          support: 'Soporte',
          altHow: 'La música baja al 10 % mientras suena una nota de voz',
          altSettings: 'Ajustes: volumen de la música y webs de notas de voz',
        },
      };

      function pickLang() {
        const fromUrl = new URLSearchParams(location.search).get('lang');
        if (fromUrl in TEXT) return fromUrl;
        try {
          const saved = localStorage.getItem('lang');
          if (saved in TEXT) return saved;
        } catch {}
        return navigator.language.toLowerCase().startsWith('es') ? 'es' : 'en';
      }

      function setLang(lang) {
        const t = TEXT[lang];
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          el.textContent = t[el.dataset.i18n];
        });
        document.querySelectorAll('[data-set-lang]').forEach((b) => {
          b.setAttribute('aria-pressed', String(b.dataset.setLang === lang));
        });
        const how = document.getElementById('shot-how');
        how.src = `images/${lang}-hero.png`;
        how.alt = t.altHow;
        const settings = document.getElementById('shot-settings');
        settings.src = `images/${lang}-popup.png`;
        settings.alt = t.altSettings;
        try {
          localStorage.setItem('lang', lang);
        } catch {}
      }

      document.querySelectorAll('[data-set-lang]').forEach((b) =>
        b.addEventListener('click', () => setLang(b.dataset.setLang)),
      );
      setLang(pickLang());
    </script>
  </body>
</html>
